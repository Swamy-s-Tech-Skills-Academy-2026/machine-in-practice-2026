# Python CI - Code Quality and Notebook Validation
# Tests Python code and validates Jupyter notebooks
# For Machine Learning in Practice 2026 educational repository

name: Python CI

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/ci-python.yml'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 nbformat nbconvert

      - name: Lint Python files with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate Jupyter notebooks
        run: |
          # Find and validate all .ipynb files
          find src/ -name "*.ipynb" -type f | while read notebook; do
            echo "Validating $notebook"
            python -m nbformat.validator "$notebook" || echo "Warning: $notebook may have issues"
          done

      - name: Check for large files
        run: |
          # Check for large data files that shouldn't be committed
          find src/10-datasets/ -type f -size +5M | while read file; do
            echo "Warning: Large file found: $file"
          done
